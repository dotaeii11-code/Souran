<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>پنل طراح · سوران‌شهر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap"><style>:root{--bg:#eaf5e4;--card:#fff;--tx:#14263a;--mu:#5d7083;--ac:#f5b400;--on:#14263a;--gn:#169c66;--rd:#d93a4a;--ln:#d3e3cb;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b1a2e;--card:#12263f;--tx:#eaf1fb;--mu:#93a8c0;--ac:#ffd23f;--gn:#3ddc97;--rd:#ff6b78;--ln:#23415f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.8 Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 14px 96px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:14px 0 2px}h2{font-size:15px;margin:18px 0 8px}.sub{color:var(--mu);font-size:12px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:10px 0}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px;text-align:center}
.st b{display:block;font-size:16px}.st small{color:var(--mu);font-size:11px}
.map{display:flex;flex-wrap:wrap;gap:4px;font-size:22px;line-height:1;margin-top:8px}.map i{font-style:normal;background:var(--bg);border-radius:8px;padding:5px}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.bar>span{display:block;height:100%;background:var(--gn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
button,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:9px 14px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
button:disabled{opacity:.45}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.w{width:100%}
input{width:100%;padding:10px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);margin:4px 0}
.warn{color:var(--rd);font-weight:700}.ok{color:var(--gn);font-weight:700}.bd{background:var(--bg);border-radius:8px;padding:0 8px;font-size:11px;color:var(--mu)}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px}nav button.on{color:var(--tx);background:var(--bg)}nav span{display:block;font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none}#toast.s{opacity:1}
.id{background:linear-gradient(135deg,#1c6b3a,#0b3a5e);color:#fff;border-radius:18px;padding:16px;margin:10px 0}.id b{font-size:24px;color:#ffd23f}
</style></head><body>
<h1>🛠️ پنل طراح</h1><main id="v"></main><nav id="nav"></nav><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>const CFG={url:'https://puiiapaitvjrqfiigrsk.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1aWlhcGFpdHZqcnFmaWlncnNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNTIxNDQsImV4cCI6MjExMDcyODE0NH0.ymyBkJqZ7X8VD9JQ1r0e_x8ccBj8X7GVZBMtk4BOP2Y'};
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s),fa=n=>Math.round(+n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={house:['🏠','خانه',3300],fire:['🚒','آتش‌نشانی',12300],school:['🏫','مدرسه',12300],park:['🌳','پارک',6300],clinic:['🏥','درمانگاه',15300],bazaar:['🛍️','بازار',8300],mall:['🏬','ایران‌مال',80300]};
const cap=c=>(c.buildings.house||0)*50;
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400)}
async function getCity(){const{data,error}=await sb.from('city_state').select('*').single();if(error)throw error;return data}
function cityHTML(c){const hl=Math.max(0,c.pop-cap(c));let t='';for(const k in T)for(let i=0;i<(c.buildings[k]||0);i++)t+=`<i>${T[k][0]}</i>`;
 (c.buildings.custom||[]).forEach(x=>t+=`<i title="${esc(x.b)}">🏷️</i>`);
 return `<div class="hud"><div class="st"><small>👥 جمعیت</small><b>${fa(c.pop)}</b><small>ظرفیت ${fa(cap(c))}</small></div><div class="st"><small>💶 بودجه</small><b>${fa(c.budget)}</b></div><div class="st"><small>🪙 پس‌انداز</small><b>${fa(c.savings)}</b></div><div class="st"><small>🍎 غذا</small><b>${fa(c.food)}</b></div><div class="st"><small>🎬 قسمت</small><b>${fa(c.episode)}</b></div><div class="st"><small>🏠 جای خالی</small><b>${fa(Math.max(0,cap(c)-c.pop))}</b></div></div>
 <div class="card"><b>نقشهٔ شهر</b><div class="map">🏛️${t}</div>${hl?`<div class="warn">⚠️ ${fa(hl)} نفر بی‌خانه‌اند</div>`:''}</div>`}
</script>
<script>
let tab='dash',C;const TABS=[['dash','📊','داشبورد'],['ep','🎬','قسمت'],['inbox','📥','صندوق']];
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();const{data}=await sb.from('admins').select('user_id').maybeSingle();if(!data){await sb.auth.signOut();return login('این حساب دسترسی طراح ندارد')}draw()}
function login(m=''){$('#nav').innerHTML='';$('#v').innerHTML=`<div class="card"><b>ورود</b><p class="warn">${m}</p><input id="em" dir="ltr" placeholder="ایمیل"><input id="pw" type="password" dir="ltr" placeholder="رمز"><button class="w" onclick="signin()">ورود</button></div>`}
async function signin(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?toast('ورود ناموفق'):init()}
async function upd(p){const{error}=await sb.from('city_state').update({...p,updated_at:new Date()}).eq('id',1);toast(error?'خطا':'ذخیره شد');draw()}
function run(){const l=+$('#l').value||0,m=+$('#m').value||0,f=+$('#f').value||0;let pop=C.pop+f,food=C.food+l*10-pop*2;const budget=C.budget+pop*100;if(food<0){pop=Math.max(0,pop-Math.ceil(-food/2));food=0}upd({episode:C.episode+1,pop,budget,food,savings:C.savings+m*50})}
function bld(k){let b=C.budget,s=C.savings;const c=T[k][2];if(b<c){const need=c-b;if(k==='house'&&C.pop>cap(C)&&s>=need){s-=need;b=0;toast('پس‌انداز اضطراری فعال شد')}else return toast('بودجه کافی نیست')}else b-=c;upd({budget:b,savings:s,buildings:{...C.buildings,[k]:(C.buildings[k]||0)+1}})}
async function setPoll(){const ls=$('#po').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean).slice(0,6);if(ls.length<2)return toast('حداقل دو گزینه');await sb.from('poll_options').update({active:false}).eq('active',true);await sb.from('poll_options').insert(ls.map(label=>({episode:C.episode,label})));toast('رأی‌گیری جدید باز شد');draw()}
async function setReq(id,s,b,h){await sb.from('requests').update({status:s}).eq('id',id);if(s==='approved')await sb.from('city_state').update({buildings:{...C.buildings,custom:[...(C.buildings.custom||[]),{b,h}]}}).eq('id',1);draw()}
async function hide(id){await sb.from('comments').update({hidden:true}).eq('id',id);draw()}
function csv(rows,name){if(!rows?.length)return toast('داده‌ای نیست');const k=Object.keys(rows[0]),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',t='\ufeff'+[k.join(','),...rows.map(r=>k.map(x=>q(r[x])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';a.click()}
async function exp(t){const{data}=await sb.from(t).select('*');csv(data,t)}
async function dashV(){const n=t=>sb.from(t).select('*',{count:'exact',head:true}).then(r=>r.count),[v,z,r,m,{data:res},{data:o}]=await Promise.all([n('votes'),n('citizens'),sb.from('requests').select('*',{count:'exact',head:true}).eq('status','pending').then(r=>r.count),n('comments'),sb.rpc('poll_results'),sb.from('poll_options').select('*').eq('active',true)]);
 const R=Object.fromEntries((res||[]).map(x=>[x.option_id,x.total]));
 return cityHTML(C)+`<div class="hud"><div class="st"><small>🗳️ رأی‌ها</small><b>${fa(v)}</b></div><div class="st"><small>🪪 شهروندان</small><b>${fa(z)}</b></div><div class="st"><small>💬 نظرها</small><b>${fa(m)}</b></div><div class="st"><small>⏳ لیست انتظار خانه</small><b>${fa(Math.max(0,z-cap(C)))}</b></div></div><div class="card"><b>رأی‌گیری فعلی</b> <span class="bd">${fa(r)} درخواست منتظر</span>${(o||[]).map(x=>`<div class="row"><span>${esc(x.label)}</span><b>${fa(R[x.id]||0)}</b></div>`).join('')||'<p class="sub">بسته است</p>'}</div>
 <div class="row"><button class="g" onclick="exp('citizens')">CSV شهروندان</button><button class="g" onclick="exp('comments')">CSV نظرها</button><button class="g" onclick="exp('requests')">CSV درخواست‌ها</button></div>`}
async function epV(){return `<div class="card"><b>🎬 اجرای قسمت ${fa(C.episode+1)}</b><p class="sub">اعداد واقعی ریلز را وارد کنید.</p><input id="l" type="number" placeholder="لایک (×۱۰ غذا)"><input id="m" type="number" placeholder="کامنت (×۵۰ یورو پس‌انداز)"><input id="f" type="number" placeholder="فالوور جدید"><button class="w" onclick="run()">اجرا</button></div>
 <div class="card"><b>🗳️ رأی‌گیری بعدی</b><input id="po" placeholder="گزینه‌ها با ویرگول: مدرسه، پارک، ایران‌مال"><button class="w" onclick="setPoll()">بازکردن رأی‌گیری</button></div>
 <h2>ساخت‌وساز</h2>${Object.keys(T).map(k=>`<div class="card row"><span>${T[k][0]} ${T[k][1]}</span><button onclick="bld('${k}')">${fa(T[k][2])} €</button></div>`).join('')}`}
async function inboxV(){const[{data:r},{data:m},{data:z}]=await Promise.all([sb.from('requests').select('*').order('id',{ascending:false}).limit(50),sb.from('comments').select('*').order('id',{ascending:false}).limit(50),sb.from('citizens').select('*').order('number',{ascending:false}).limit(50)]);
 return '<h2>🏷️ درخواست‌ها</h2>'+((r||[]).map(x=>`<div class="card"><div class="row"><span><b>${esc(x.building)}</b> · @${esc(x.handle)}</span><span class="bd">${x.status}</span></div>${x.status==='pending'?`<div class="row" style="margin-top:8px"><button onclick="setReq(${x.id},'approved','${esc(x.building).replace(/'/g,'')}','${esc(x.handle).replace(/'/g,'')}')">✅ تأیید</button><button class="g" onclick="setReq(${x.id},'rejected')">رد</button></div>`:''}</div>`).join('')||'<p class="sub">خالی</p>')
 +'<h2>💬 نظرها</h2>'+((m||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.author)} <span class="bd">قسمت ${fa(x.episode)}</span></b>${x.hidden?'<span class="bd">مخفی</span>':`<button class="g" onclick="hide(${x.id})">مخفی</button>`}</div>${esc(x.body)}</div>`).join('')||'<p class="sub">خالی</p>')
 +'<h2>🪪 شهروندان</h2><div class="card">'+((z||[]).map(x=>`${fa(x.number)} · ${esc(x.name)}`).join('<br>')||'خالی')+'</div>'}
async function draw(){try{C=await getCity();$('#v').innerHTML=await {dash:dashV,ep:epV,inbox:inboxV}[tab]();$('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="tab='${x[0]}';draw()"><span>${x[1]}</span>${x[2]}</button>`).join('')+'<button onclick="sb.auth.signOut().then(init)"><span>🚪</span>خروج</button>'}catch(e){$('#v').innerHTML='<div class="card warn">خطا در بارگذاری</div>'}}
init();
</script></body></html>
